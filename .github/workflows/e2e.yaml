name: E2E
on:
  pull_request:
  push:
    branches:
      - main
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: Checkout e2e repo
        uses: actions/checkout@v4
        with:
          repository: grachevelloper/about_me_e2e
          path: about_me_e2e

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: about_me_e2e/package-lock.json

      - name: Install e2e dependencies
        working-directory: about_me_e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: about_me_e2e
        run: npx playwright install --with-deps chromium

      - name: Run e2e
        working-directory: about_me_e2e
        env:
          APP_REPO_PATH: ${{ github.workspace }}
          JWT_SECRET: e2e-jwt-secret
          REFRESH_SECRET: e2e-refresh-secret
          S3_ACCESS_KEY: test
          S3_SECRET_ACCESS_KEY: test
        run: npm test -- --reporter=list
