services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./be
    command: ['node', 'dist/src/main.js']
    environment:
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_PORT: 5432
      DB_HOST: db
      BE_PORT: 3000
      NODE_ENV: test
      JWT_SECRET: ${JWT_SECRET:-e2e-local-jwt-secret}
      REFRESH_SECRET: ${REFRESH_SECRET:-e2e-local-refresh-secret}
      GRACHEVELOPERS_PASSWORD: ${GRACHEVELOPERS_PASSWORD:-e2e-local-gracheveloper-password}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-e2e-local-access-key}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-e2e-local-secret-key}
      S3_PUBLIC_DOMAIN: ${S3_PUBLIC_DOMAIN:-http://localhost:9000}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./fe
    environment:
      FE_PORT: 5173
      REACT_APP_ENABLE_MOCKS: 'false'
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    ports:
      - '${E2E_HTTP_PORT:-18080}:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
