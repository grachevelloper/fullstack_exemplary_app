services:
  db:
    image: postgres:16.11-alpine
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    environment:
      POSTGRES_DB: ${DB_NAME:-postgres}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./be
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BE_PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-postgres}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-local-development-jwt-secret}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_TENANT_ID: ${S3_TENANT_ID}
      S3_KEY_ID: ${S3_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_PUBLIC_DOMAIN: ${S3_PUBLIC_DOMAIN}
      GRACHEVELOPERS_PASSWORD: ${GRACHEVELOPERS_PASSWORD}
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET}
      YANDEX_REDIRECT_URI: ${YANDEX_REDIRECT_URI:-https://grachevnikolay.ru/api/auth/yandex/callback}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          'fetch("http://127.0.0.1:3000/api/health/ready").then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 30s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'

  migration:
    build:
      context: ./be
    profiles: [tools]
    restart: 'no'
    command:
      [
        node,
        ./node_modules/typeorm/cli.js,
        migration:run,
        -d,
        ./dist/src/data-source-cli.js,
      ]
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-postgres}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      GRACHEVELOPERS_PASSWORD: ${GRACHEVELOPERS_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'

  backup:
    build:
      context: ./ops/backup
    profiles: [tools]
    restart: 'no'
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-postgres}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET}
      BACKUP_S3_KEY_ID: ${BACKUP_S3_KEY_ID}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-postgres}
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'

  frontend:
    build:
      context: ./fe
    restart: unless-stopped
    stop_grace_period: 15s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:1.28.3-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:?NGINX_SERVER_NAME must be set to the bare public hostname, for example example.ru}
    volumes:
      - ${NGINX_TEMPLATE:-./nginx/prod.conf.template}:/etc/nginx/templates/default.conf.template:ro
      - ${CERTBOT_WWW_PATH:-./certbot/www}:/var/www/certbot:ro
      - ${LETSENCRYPT_PATH:-/etc/letsencrypt}:/etc/letsencrypt:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'

volumes:
  postgres_data:
